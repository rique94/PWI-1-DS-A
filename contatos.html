<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Essa página tem a finalidade de ser um formulário para cadastar seu contato e podermos entrarmos em contato com você por meio do informado"
		/>
		<meta name="author" content="Autor" />
		<title>Contatos</title>
		<!--CSS Coisado-->
		<link rel="stylesheet" href="estilos.css" />
		<!--CSS Incorporado-->
		<style>
			.tabela-contato {
				width: 50%;
				margin: auto;
				border-collapse: collapse;
				background-color: #ffffff;
				box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.2);
				border-radius: 10px;
				overflow: hidden;
			}
			.tabela-contato th {
				background-color: #60606c;
				color: #ffffff;
				padding: 15px;
			}
			.tabela-contato td {
				padding: 12px;
				border-bottom: 1px solid #aba4a4;
			}
			.tabela-contato tr:hover {
				background-color: #cac6c6;
			}

			.alerta {
				background-color: #fff3cd;
				color: #dc3545;
				border: 1px solid #ffc107;
				padding: 10px;
				text-align: center;
				font-weight: bold;
				margin-top: 20px;
				border-radius: 5px;
			}

			.sucesso {
				background-color: #d1e7dd;
				color: #198754;
				border: 1px solid #198754;
				padding: 10px;
				text-align: center;
				font-weight: bold;
				margin-top: 20px;
				border-radius: 5px;
			}

			#mensagem {
				text-align: center;
				font-weight: bold;
				margin-top: 20px;
			}
		</style>
	</head>
	<body>
		<header>
			<h1 id="h1">Contatos</h1>
			<nav>
				<h4>
					| <a href="index.html">Home</a> |
					<a href="quemsomos.html">Quem somos</a> | Contatos |
					<a href="cronologiahtml.html">Cronologia HTML</a> |
					<a href="https://eteccarapicuiba.cps.sp.gov.br/" target="_blank" a
						>Etec Carapicuiba</a
					>
				</h4>
			</nav>
		</header>
		<main>
			<section>
				<h3>CADASTRO</h3>
				<!--Definição de Tabela-->
				<!--Definição de Formulário-->
				<form action="" method="post" id="formIdContatos">
					<table class="tabela-contato">
						<thead>
							<tr>
								<th colspan="2">Dados Pessoais para Contato</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td class="label"><label for="f_nome">Nome: </label></td>
								<td>
									<input
										type="text"
										name="name"
										id="f_nome"
										size="40"
										maxlength="40"
										placeholder="Nome"
									/>
								</td>
							</tr>
							<tr>
								<td class="label"><label for="f_mail">Email: </label></td>
								<td>
									<input
										type="text"
										name="email"
										id="f_mail"
										size="40"
										maxlength="40"
										placeholder="Email"
									/>
								</td>
							</tr>
							<tr>
								<td class="label"><label for="f_fone">Telefone: </label></td>
								<td>
									<input
										type="text"
										name="telefone"
										id="f_fone"
										size="12"
										maxlength="11"
										placeholder="Telefone"
									/>
								</td>
							</tr>
							<tr style="text-align: center">
								<td colspan="2" class="acoes">
									<button class="btn btn-cadastrar" type="button">
										Cadastar
									</button>
									<button class="btn bnt-apagar">Apagar</button>
								</td>
							</tr>
						</tbody>
					</table>
				</form>
			</section>
			<p id="mensagem"></p>
		</main>
		<footer>
			<p>&copy; Direitos Reservados 2026 - Desenvolvido por Henrique Garcias</p>
			<a href="#h1">Ir para o topo...</a>
		</footer>
	</body>
	<script>
		function MostrarMensagem() {
			let nome = document.getElementById("f_nome").value;
			let email = document.getElementById("f_email").value;
			let fone = document.getElementById("f_fone").value;

			// Verificação do campo nome
			if (nome == "") 
			{
				document.getElementById("mensagem").className = "alerta";
				document.getElementById("mensagem").innerHTML = "Digite o seu nome!";

				return; 
			}
			// Verificação do campo email
			else if (email == "") {
				document.getElementById("mensagem").className = "alerta";
				document.getElementsByName("mensagem"),innerHTML = "Digite o seu e-mail!";

				return;
			}
			// Verificação do campo fone
			else if (fone == "") {
				document.getElementById("mensagem").className = "alerta";
				document.getElementById("mensagem").innerHTML = "Digite seu telefone!";

				return;
			}

			//Todos os campos preenchidos
			document.getElementById("mensagem").className = "sucesso";
			document.getElementById("mensagem").innerHTML = "Olá " + nome + "! Todos os dados foram preenchidos com sucesso!";
		}

		function ApagarMensagem() {
			document.getElementById("mensagem").className = "";
			document.getElementById("mensagem").innerHTML = "";
		}
	</script>
</html>
